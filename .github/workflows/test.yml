name: test
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - run: make sync-assets
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/propc
